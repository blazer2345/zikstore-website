<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp Database</title>
  <style>
    body{
  background-color: #1e3a8a;
  padding: 0px 15px;
  color: white;
}

nav a:hover{
background-color: white;
color: red;
border-color: gray;
}

table{
  width: 100%;
  border-collapse: collapse;
  background: #1e3a8a;
  box-shadow: 0 4px 12px #0002;
  height: 100%;
  overflow: hidden;
}
table tr td {
  padding: 12px 15px;
  border-bottom: 1px solid #ddd;
  text-decoration: none;
  color: white;
  padding: 0px 10px;
  border: 2px solid white;
  margin-left: 10px;
}
table tr th{
  text-decoration: none;
  color: white;
  padding: 0px 10px;
  border: 2px solid yellow;
  margin-left: 10px;
  background: #1e3a8a;
}
  </style>
</head>
<body>
  {% if msg %}
<div style="padding: 10px; color: white; width: fit-content; background-color: green; margin: 10px auto;">
  <p>{{ msg }}</p>
<a href="{% url 'record' %}"><button>Back to student record</button></a>
</div>
{% else %}
    <h1>STUDENT RECORDS</h1>
    <table border="1">      <tr>
        <th>USERNAME</th>
        <th>EMAIL</th>
        <th>PHONE</th>
        <th>PASSWORD</th>
        <th>DELETE</th>
      </tr>
      {% for user in users %}
      <tr>
        <td>{{user.username}}</td> 
        <td>{{user.email}}</td>
        <td>{{user.phone}}</td>
        <td>{{user.password}}</td>
      </tr>
      {% endfor %}
    </table>
    {% endif %}
</body>
</html>
